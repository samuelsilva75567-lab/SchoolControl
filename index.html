<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolControl | Painel Administrativo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tela de Login Administrativo */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: #080d18;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }
        .login-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .login-card h2 {
            color: #f8fafc;
            margin-bottom: 6px;
            font-size: 24px;
        }
        .login-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .login-card label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #080d18;
            color: #f8fafc;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .login-card button:hover {
            background: #1d4ed8;
        }
        .erro-login {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }

        /* Cabeçalho e Menu Estilizados do Painel */
        .admin-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        .admin-header {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }
        .admin-header h1 {
            font-size: 26px;
            color: #f8fafc;
            margin: 0 0 4px 0;
        }
        .admin-header h1 span {
            color: #3b82f6;
        }
        .admin-header p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }
        .acoes-topo {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-qr-atalho {
            background: #10b981;
            color: #022c22;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-qr-atalho:hover {
            background: #34d399;
        }
        .btn-sair-admin {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sair-admin:hover {
            background: #ef4444;
            color: #ffffff;
        }
        .admin-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .admin-nav button {
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #1e293b;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-nav button:hover,
        .admin-nav button.ativo {
            background: #2563eb;
            border-color: #3b82f6;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN ADMINISTRATIVO -->
    <div id="telaLoginAdmin" class="login-overlay">
        <div class="login-card">
            <h2>School<span style="color: #3b82f6;">Control</span></h2>
            <p>Acesso restrito à administração escolar.</p>

            <div id="erroLoginAdmin" class="erro-login">
                E-mail ou senha incorretos.
            </div>

            <form id="formLoginAdmin">
                <label for="emailAdmin">E-mail do Administrador</label>
                <input
                    type="email"
                    id="emailAdmin"
                    placeholder="admin@escola.com"
                    required
                >

                <label for="senhaAdmin">Senha</label>
                <input
                    type="password"
                    id="senhaAdmin"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">Entrar no Painel</button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="painelAdminPrincipal" class="admin-wrapper" style="display: none;">
        <header class="admin-header">
            <div>
                <h1>School<span>Control</span></h1>
                <p>Painel Administrativo Escolar</p>
            </div>

            <div class="acoes-topo">
                <button type="button" class="btn-qr-atalho" onclick="abrirPaginaQrCode()">
                    Abrir Tela do QR Code ↗
                </button>
                <button type="button" class="btn-sair-admin" onclick="sairDoPainel()">
                    Sair
                </button>
            </div>
        </header>

        <nav class="admin-nav">
            <button onclick="abrirTela('inicio')">Início</button>
            <button onclick="abrirTela('alunos')">Alunos</button>
            <button onclick="abrirTela('entrada')">Entrada / Saída</button>
            <button onclick="abrirTela('historico')">Histórico</button>
            <button onclick="abrirTela('relatorios')">Relatórios</button>
        </nav>

        <section class="resumo">
            <div class="card">
                <h3>Total de Alunos</h3>
                <strong id="totalAlunos">0</strong>
            </div>
            <div class="card">
                <h3>Entradas Hoje</h3>
                <strong id="totalEntradas">0</strong>
            </div>
            <div class="card">
                <h3>Saídas Hoje</h3>
                <strong id="totalSaidas">0</strong>
            </div>
        </section>

        <main id="areaConteudo" class="conteudo"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
